; Desk Buddy — SpotPear/Waveshare ESP32-S3-LCD-1.3 (prism)
; ESP32-S3R8, 16MB flash, 8MB octal PSRAM, ST7789 240x240, CH343 USB-serial

[platformio]
default_envs = buddy

[env:buddy]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_lump.csv
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@1.3.0
; Lump's drawings (data/lump.bin) are not built in: they live in the "lump" partition,
; written by tools/flash.sh (cable) or tools/ota.py --art (Wi-Fi).

; LCDWiki 3.2 inch ESP32-32E, classic ESP32 / 4 MB / no PSRAM.
[env:esp32-32e]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = partitions_esp32_32e.csv
monitor_speed = 115200
build_flags = -DBOARD_ESP32_32E=1 -DLUMP_NO_OTA=1
lib_deps =
    lovyan03/LovyanGFX@1.3.0
